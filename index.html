<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/6f4f6c7b7a.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>🌤 Weather Dashboard</h1>
            <p>Search any city to get live weather updates</p>
        </header>

        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter City Name">

            <button id="searchBtn">
                <i class="fas fa-search"></i> Search
            </button>

        </div>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            Loading Weather...
        </div>

        <!-- Error -->
        <div id="error" class="error hidden">
            City not found.
        </div>

        <!-- Weather Card -->

        <section id="weatherCard" class="weather-card hidden">

            <h2 id="cityName">City Name</h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather Icon">

            <h1 id="temperature">25°C</h1>

            <h3 id="description">
                Clear Sky
            </h3>

            <div class="details">

                <div class="detail-box">

                    <i class="fas fa-tint"></i>

                    <h4>Humidity</h4>

                    <p id="humidity">50%</p>

                </div>

                <div class="detail-box">

                    <i class="fas fa-wind"></i>

                    <h4>Wind</h4>

                    <p id="wind">10 km/h</p>

                </div>

                <div class="detail-box">

                    <i class="fas fa-temperature-high"></i>

                    <h4>Feels Like</h4>

                    <p id="feelsLike">27°C</p>

                </div>

            </div>

        </section>

        <!-- Forecast -->

        <section class="forecast">

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">

                <!-- Forecast Cards Generated by JavaScript -->

            </div>

        </section>

    </div>

    <script src="storage.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>

</body>
</html>
